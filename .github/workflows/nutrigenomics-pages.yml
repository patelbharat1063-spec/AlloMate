name: Deploy AlloMate GitHub Pages (including Nutrigenomics app)

on:
  push:
    branches: [main]
    paths:
      - "nutrigenomics-health-coach/**"
      - ".github/workflows/nutrigenomics-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare complete repository site
        run: |
          mkdir -p _site
          git ls-files -z | while IFS= read -r -d '' file; do
            mkdir -p "_site/$(dirname "$file")"
            cp "$file" "_site/$file"
          done
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy complete site
        id: deployment
        uses: actions/deploy-pages@v4
